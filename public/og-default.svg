<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kian Media Production">
  <!-- V2-1.3-B — branded share card, 1200x630 (1.91:1, what every scraper crops to).
       Replaces the 800x800 square logo, which was letterboxed or cropped by every
       platform. SVG on purpose: ~2KB, no build step, no image pipeline, no new
       dependency (G12). Fonts are NOT referenced — text is drawn with generic
       families so the card cannot depend on a webfont a scraper will not load. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E31E24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#E31E24"/>

  <g transform="translate(96, 210)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="86" font-weight="700" letter-spacing="2">KIAN MEDIA</text>
    <text x="0" y="58" fill="rgba(255,255,255,0.55)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="500" letter-spacing="9">PRODUCTION</text>
    <rect x="0" y="104" width="120" height="3" fill="#E31E24"/>
    <text x="0" y="176" fill="rgba(255,255,255,0.82)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="400">Cinematic Video Production · Saudi Arabia</text>
    <text x="0" y="230" fill="rgba(255,255,255,0.45)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="400">kianmedia.com</text>
  </g>
</svg>
