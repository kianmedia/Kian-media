name: CI

# يشغّل الفحوص الفعلية على GitHub runners (بيئة التوليد لا تملك Node، فتُنفَّذ هنا).
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

      # Wave 7 · V2-7.8-A — أُضيفت **بعد** نجاحها محلّيًّا (15/15 على desktop).
      # ⛔ chromium وحده: ثلاثة متصفّحات تُضاعف زمن CI بلا مقابل هنا.
      # ⛔ ولا أسرار: الإعداد يمنع الشبكة الخارجية ولا يستعمل اعتمادًا.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop)
        run: npx playwright test --project=desktop
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm install
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor || true
